apis:
- aid: cambio-healthcare-systems:cambio-healthcare-systems-fhir-r4
  name: Cambio Open Services FHIR R4 API
  description: >-
    HL7 FHIR R4 (4.0.1) server exposing Cambio COSMIC clinical data through 24 FHIR resource types — Patient,
    Practitioner, Organization, Encounter, Condition, Observation, MedicationRequest, MedicationDispense,
    DiagnosticReport, Appointment, CarePlan, Consent, Immunization, Invoice, Location, Questionnaire,
    QuestionnaireResponse, ServiceRequest, Task and more — with Cambio-specific FHIR profiles published
    as an Implementation Guide. Built on HAPI FHIR and secured with SMART-on-FHIR style OAuth 2.0 scopes.
  humanURL: https://fhir.openservices.cambio.se/site/index.html
  baseURL: https://api.openservices.cambio.se/fhir
