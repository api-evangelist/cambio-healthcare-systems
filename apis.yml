- aid: cambio-healthcare-systems:cambio-healthcare-systems-attention-signal
  name: Attention signal
  description: 'Intended Use: The intended use of this API is to retrieve attention signals for a given
    patient. Attention signals can be information about allergies, contagious infections and more that
    is relevant when providing care to the patient. The result can be filtered by using a time interval.
    The intended use for reading data with this API is in first hand that the API is applied for direct
    access and should not be used to transfer data between caregivers. If it should be used for "data
    copying" between care providers, patient consent must be handled outside the API. Specific Rules and
    Limitations: The consumer of the API is responsible for making sure data retrieved is filtered in
    compliance with laws and regulations prior to presenting it to any end-users. The parameters AccessZoneUnit
    represent the PDL Care Unit (Vårdenhet) and CareProvider represents PDL Care provider (Vårdgivare)
