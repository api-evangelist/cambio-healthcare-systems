- aid: cambio-healthcare-systems:cambio-healthcare-systems-payment-notice
  name: Payment notice
  description: 'Intended Use: The intended use of this API is to register the payment for a given appointment
    for the given patient. Specific Rules and Limitations: Rule: The only status that can be set is PAID.
    One may not use any other status in this API. This API accept only CARD and INVOICE as payment type.
    Limitation: Before register payment contact should registered for arrival and need to properly setup
    self-service to handle the payment. Message Description : The message sent includes the contact, payment
    status and which payment method was used. Note: There is a header parameter as a patient but it is
    not a mandatory one possible to register payment without this header parameter. Rules table: | Type
