aid: cambio-healthcare-systems
name: Cambio Healthcare Systems
description: Cambio Healthcare Systems is a Swedish health-IT company founded in 1993 in Linkoping and
  headquartered in Stockholm, best known for Cambio COSMIC, an electronic health record and clinical decision
  support platform used across Swedish regions, Denmark and the United Kingdom by well over 100,000 clinical
  users. Cambio runs a public developer programme, Cambio Open Services (COS), which publishes 19 REST
  APIs and an HL7 FHIR R4 server on Azure API Management at api.openservices.cambio.se, together with
  a published FHIR Implementation Guide of COSMIC-specific profiles, a Keycloak OpenID Connect authorization
  server with SMART-on-FHIR style scopes, and a synthetic-data sandbox. COSMIC and its clinical decision
  support are CE-marked and MDR-certified (notified body BSI-2797), and the company holds ISO 9001, 13485,
  14001, 20000 and 27001 certifications.
image: https://www.cambiogroup.com/wp-content/uploads/2021/03/cropped-Cambio-C-560x560px-270x270.png
url: https://raw.githubusercontent.com/api-evangelist/cambio-healthcare-systems/refs/heads/main/apis.yml
