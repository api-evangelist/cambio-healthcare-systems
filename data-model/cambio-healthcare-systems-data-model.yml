note: 'Two parallel data models. The COSMIC REST APIs carry an EHR-extract vocabulary built on HL7 v3 datatype primitives
  (II identifiers, TS timestamps, CD/CE coded values, PQ physical quantities) wrapped in per-domain EHRExtract envelopes;
  the FHIR R4 server exposes the same clinical estate through 24 standard resource types with Cambio profiles. Every
  edge below is a $ref in a spec the provider publishes. NOTE: the portal serves its component schemas as Swagger
  2.0 definitions blocks, so the exported documents reference "#/definitions/..." inside an OpenAPI 3.0.1 envelope
  — a real defect in the published contract. This pipeline rewrote the pointers to "#/components/schemas/..." when
  assembling openapi/; openapi/_original/ holds the portal export unmodified.'
